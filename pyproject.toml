[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypsa-chile"
version = "0.1.0"
description = "Open dispatch model of the Chilean National Electric System (SEN) built with PyPSA and public data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjay Ramchandani" }]
requires-python = ">=3.10"
keywords = ["energy", "power systems", "pypsa", "chile", "economic dispatch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pypsa>=0.33",
  "highspy>=1.7",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "requests>=2.31",
  "plotly>=5.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pypsa-chile = "pypsa_chile.cli:main"

[project.urls]
Repository = "https://github.com/sanjaygrr/pypsa-chile"

[tool.hatch.build.targets.wheel]
packages = ["src/pypsa_chile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
